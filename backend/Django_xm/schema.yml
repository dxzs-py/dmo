      description: 启动工作流请求
      properties:
        user_question:
          type: string
          description: 用户的学习问题
          minLength: 1
        query:
          type: string
          description: 用户的学习问题 (别名)
          minLength: 1
        workflow_type:
          type: string
          description: 工作流类型
        thread_id:
          type: string
          nullable: true
          description: 可选的线程ID
        knowledge_base_ids:
          type: array
          items:
            type: string
            maxLength: 100
          description: 用户选择的知识库名称列表（原始名称，对应 KnowledgeBaseSelector 的 v-model）
        use_deep_thinking:
          type: boolean
          default: false
          description: 是否启用深度思考
        use_web_search:
          type: boolean
          default: false
          description: 是否启用网络查询
        provider_id:
          type: string
          nullable: true
          description: 模型提供商 ID
          maxLength: 50
        model_name:
          type: string
          nullable: true
          description: 模型名称
          maxLength: 100
        temperature:
          type: number
          format: double
          maximum: 2
          minimum: 0
          nullable: true
          description: 生成温度
        max_tokens:
          type: integer
          minimum: 1
          nullable: true
          description: 最大生成 token 数
        special_params:
          type: object
          additionalProperties: {}
          nullable: true
          description: 模型专属参数（如 thinking、reasoning_effort）
    WorkflowSubmit:
      type: object
      description: 提交答案请求
      properties:
        thread_id:
          type: string
        answers:
          type: object
          additionalProperties:
            type: string
          description: '用户答案，格式：{question_id: answer}'
      required:
      - answers
      - thread_id
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
