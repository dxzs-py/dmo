      - basicAuth: []
      responses:
        '200':
          description: No response body
components:
  schemas:
    ApprovalRead:
      type: object
      description: |-
        审批读序列化器。

        用于所有 GET 端点（list/detail/state），暴露全部展示字段。
        全部字段标记 read_only，客户端无法通过任何端点修改审批字段。
      properties:
        interrupt_id:
          type: string
          readOnly: true
        source:
          allOf:
          - $ref: '#/components/schemas/SourceEnum'
          readOnly: true
        source_id:
          type: string
          readOnly: true
        chat_session_id:
          type: string
          readOnly: true
          nullable: true
        tool_name:
          type: string
          readOnly: true
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        action:
          type: string
          readOnly: true
        operation:
          type: string
          readOnly: true
        danger_level:
          type: string
          readOnly: true
        parameters:
          readOnly: true
        state:
          allOf:
          - $ref: '#/components/schemas/StateEnum'
          readOnly: true
        user_input:
          type: string
          readOnly: true
          nullable: true
        approved_by:
          allOf:
          - $ref: '#/components/schemas/ApprovedBy'
          readOnly: true
        extra:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - action
      - approved_by
      - chat_session_id
      - created_at
      - danger_level
      - description
      - extra
      - interrupt_id
      - operation
      - parameters
      - resolved_at
      - source
      - source_id
      - state
      - title
      - tool_name
      - user_input
    ApprovalWrite:
      type: object
      description: |-
        审批写序列化器。

        白名单设计：客户端仅可提交 ``approved`` 与 ``user_input`` 两个字段。

        - ``approved``：是否批准（仅 resume 接口读取；reject 接口忽略并强制 False）
        - ``user_input``：用户输入文本（仅当 approval.action == confirm_with_input 时使用）

        其他审批字段（state、parameters、approved_by、source 等）由服务端控制，
        客户端尝试提交 protected 字段会触发 ``to_internal_value`` 显式拒绝（返回 400），
        而非静默忽略——便于日志审计与暴露潜在恶意行为。
      properties:
        approved:
          type: boolean
          default: true
        user_input:
          type: string
          nullable: true
          maxLength: 10000
    ApprovedBy:
      type: object
      description: 审批人简要信息。
      properties:
        id:
          type: integer
        username:
          type: string
      required:
      - id
      - username
    ChatMessage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        session:
          type: integer
          readOnly: true
          title: 会话
        role:
          allOf:
          - $ref: '#/components/schemas/ChatMessageRoleEnum'
          title: 角色
        content:
          type: string
          title: 内容
          maxLength: 50000
        sources:
          nullable: true
          title: 来源
        plan:
          nullable: true
          title: 计划
        chain_of_thought:
          nullable: true
          title: 思维链
        tool_calls:
          nullable: true
          title: 工具调用
        approval:
          nullable: true
          title: 审批数据
        reasoning:
          nullable: true
          title: 推理
        suggestions:
          nullable: true
          title: 建议问题
        versions:
          nullable: true
          title: 消息版本
        current_version:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: 当前版本索引
          description: 当前展示的版本索引，指向 versions 数组的位置
        attachments:
          type: string
          readOnly: true
        attachment_ids:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: 创建时间
        model:
          type: string
          nullable: true
          title: 使用的模型
          maxLength: 100
        token_count:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Token 数量
        token_detail:
          title: Token 明细
        response_time:
          type: number
          format: double
          title: 响应时间(秒)
        research_task_id:
          type: string
          nullable: true
          title: 关联深度研究任务ID
          maxLength: 100
        research_task_deleted:
          type: string
          readOnly: true
      required:
      - attachment_ids
      - attachments
      - created_at
      - id
      - research_task_deleted
      - session
    ChatMessageRoleEnum:
      enum:
      - user
      - assistant
      - system
      type: string
      description: |-
        * `user` - 用户
        * `assistant` - 助手
        * `system` - 系统
    ChatRequest:
      type: object
      description: |-
        聊天请求输入验证

        用途：验证前端发送的聊天请求数据
        使用 Serializer 原因：输入数据不直接对应单一模型字段，
        需要灵活组合 message/chat_history/mode 等字段
      properties:
        message:
          type: string
          description: 用户消息内容，1-10000字符
          maxLength: 10000
          minLength: 1
        chat_history:
          type: array
          items:
            $ref: '#/components/schemas/Message'
          nullable: true
        mode:
          type: string
          default: agent
          description: 对话模式标识
          maxLength: 50
        use_tools:
          type: boolean
          default: true
          description: 是否使用工具
        use_web_search:
          type: boolean
          default: false
          description: 是否启用联网搜索
        use_knowledge_base:
          type: boolean
          default: false
          description: 是否启用知识库检索
        use_deep_thinking:
          type: boolean
          default: false
          description: 是否启用深度思考
        use_mcp:
          type: boolean
          default: false
          description: 是否启用 MCP 工具
        selected_mcp_servers:
          type: array
          items:
            type: string
            maxLength: 50
          nullable: true
          description: 选中的 MCP Server 名称列表（每个名称最长 50 字符），为空则使用所有已配置的 Server
        selected_tools:
          type: array
          items:
            type: string
            maxLength: 50
          nullable: true
          description: 选中的工具名称列表（每个名称最长 50 字符），为空则根据模式自动选择
        streaming:
          type: boolean
          default: false
          description: 是否流式输出
        session_id:
          type: string
          nullable: true
          maxLength: 100
        selected_knowledge_base:
          type: string
          nullable: true
          description: 选中的知识库ID
          maxLength: 200
        selected_knowledge_bases:
          type: array
          items:
            type: string
            maxLength: 200
          nullable: true
          description: 选中的知识库ID列表（多选）
        attachment_ids:
          type: array
          items:
            type: integer
          nullable: true
          description: 附件ID列表，用于基于文件内容回答问题
        provider_id:
          type: string
          nullable: true
          description: 模型提供商 ID（openai/deepseek/groq/baidu_qianfan/anthropic）
          maxLength: 50
        model_name:
          type: string
          nullable: true
          description: 模型名称，如 gpt-4o-mini、deepseek-v4-flash
          maxLength: 100
        special_params:
          type: object
          additionalProperties: {}
          nullable: true
          description: 提供商专属参数，如 DeepSeek 的 thinking/reasoning_effort
        temperature:
          type: number
          format: double
          maximum: 2.0
          minimum: 0.0
          nullable: true
          description: 温度参数，0-2之间
        max_tokens:
          type: integer
          maximum: 32768
          minimum: 1
          nullable: true
          description: 最大生成 token 数
        research_task_id:
          type: string
          nullable: true
          description: 关联的深度研究任务ID，用于注入研究上下文
          maxLength: 100
        continue_task_id:
          type: string
          nullable: true
          description: 继续研究的任务ID，用于加载先前研究成果
          maxLength: 100
      required:
      - message
    ChatResponse:
      type: object
      description: |-
        聊天响应输出格式

        用途：统一非流式聊天的响应结构
        使用 Serializer 原因：响应数据是聚合结果（含 tools_used/success 等），
        不直接对应数据库模型
      properties:
        message:
          type: string
        mode:
          type: string
        tools_used:
          type: array
          items:
            type: string
        success:
          type: boolean
        error:
          type: string
          nullable: true
        session_id:
          type: string
          nullable: true
      required:
      - message
      - mode
      - success
      - tools_used
    ChatSessionCreate:
      type: object
      description: |-
        会话创建序列化器

        用途：创建新会话时验证输入并生成实例
        绑定模型：ChatSession
      properties:
        title:
          type: string
          title: 会话标题
          maxLength: 200
        mode:
          allOf:
          - $ref: '#/components/schemas/ModeEnum'
          title: 对话模式
        selected_knowledge_base:
          type: string
          nullable: true
          title: 选中的知识库
          maxLength: 200
        selected_knowledge_bases:
          nullable: true
          title: 选中的知识库列表
    ChatSessionDetail:
      type: object
