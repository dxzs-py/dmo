          description: No response body
components:
  schemas:
    ApprovalRead:
      type: object
      description: |-
        审批读序列化器。

        用于所有 GET 端点（list/detail/state），暴露全部展示字段。
        全部字段标记 read_only，客户端无法通过任何端点修改审批字段。
      properties:
        interrupt_id:
          type: string
          readOnly: true
        source:
          allOf:
          - $ref: '#/components/schemas/SourceEnum'
          readOnly: true
        source_id:
          type: string
          readOnly: true
        chat_session_id:
          type: string
          readOnly: true
          nullable: true
        tool_name:
          type: string
          readOnly: true
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        action:
          type: string
          readOnly: true
        operation:
          type: string
          readOnly: true
        danger_level:
          type: string
          readOnly: true
        parameters:
          readOnly: true
        state:
          allOf:
          - $ref: '#/components/schemas/StateEnum'
          readOnly: true
        user_input:
          type: string
          readOnly: true
          nullable: true
        approved_by:
          allOf:
          - $ref: '#/components/schemas/ApprovedBy'
          readOnly: true
        extra:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - action
      - approved_by
      - chat_session_id
      - created_at
      - danger_level
      - description
      - extra
      - interrupt_id
      - operation
      - parameters
      - resolved_at
      - source
      - source_id
      - state
      - title
      - tool_name
      - user_input
    ApprovalWrite:
      type: object
      description: |-
        审批写序列化器。

        白名单设计：客户端仅可提交 ``approved`` 与 ``user_input``。

        - ``approved``：是否批准（仅 resume 接口读取；reject 接口忽略并强制 False）
        - ``user_input``：用户输入文本（仅当 approval.action == confirm_with_input 时使用）

        其他审批字段（state、parameters、approved_by、source 等）由服务端控制，
        客户端尝试提交 protected 字段会触发 ``to_internal_value`` 显式拒绝（返回 400），
        而非静默忽略——便于日志审计与暴露潜在恶意行为。
      properties:
        approved:
          type: boolean
          default: true
        user_input:
          type: string
          nullable: true
          maxLength: 10000
    ApprovedBy:
      type: object
      description: 审批人简要信息。
      properties:
        id:
          type: integer
        username:
          type: string
      required:
      - id
      - username
    ChatMessage:
      type: object
      description: |-
        消息序列化器（模型输出 + 创建/更新输入）

        research_task_map 契约（dj-04）：
        - 实例化用于序列化（读取 ``.data``，含经 ChatSessionDetailSerializer
          嵌套使用）时，必须经 ``context={"research_task_map": {...}}`` 提供
          研究任务映射，映射由 :func:`build_research_task_map` 一次批量查询
          构建（单条消息场景同样构造单元素映射）；缺失映射时
          research_task_status / research_task_deleted 直接 KeyError 快速
          失败，不提供逐条查询兜底。
        - 仅做输入校验（``data=`` 且不读取 ``.data``）的实例传空映射即可。
      properties:
        id:
          type: integer
          readOnly: true
        session_id:
          type: integer
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/ChatMessageRoleEnum'
          title: 角色
        content:
          type: string
          title: 内容
          maxLength: 50000
        sources:
          title: 来源
        plan:
          title: 计划
        chain_of_thought:
          readOnly: true
        tool_calls:
          readOnly: true
        approval:
          title: 审批数据
        reasoning:
          title: 推理
        subagent_contents:
          readOnly: true
        suggestions:
          title: 建议问题
        versions:
          title: 消息版本
        current_version:
          type: integer
        is_finalized:
          type: boolean
        attachments:
          type: array
          items: {}
          readOnly: true
        attachment_ids:
          type: array
          items:
            type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        model:
          type: string
          nullable: true
          title: 使用的模型
          maxLength: 100
        token_count:
          type: integer
          readOnly: true
        token_detail:
          readOnly: true
        response_time:
          type: number
          format: double
          readOnly: true
        research_task_id:
          type: string
          readOnly: true
        research_task_status:
          type: string
          nullable: true
          description: |-
            返回关联研究任务的权威状态（P7 根因修复；dj-04 批量化）

            前端刷新后凭该字段判定"研究进行中/已完成"，避免快照不含状态导致误显。
            从 context["research_task_map"] 批量映射读取（调用方经
            build_research_task_map 一次 all_objects 查询构建，含软删除），
            消除逐条查询的 N+1；映射缺失时 KeyError 快速失败，禁止逐条查询兜底。
          readOnly: true
        research_task_deleted:
          type: boolean
          nullable: true
          description: |-
            检查关联的研究任务是否已软删除（dj-04 批量化）

            语义与逐条查询版完全一致：任务不存在 → True（视为已删除）；
            任务存在 → task.is_deleted（软删除可见性由 build_research_task_map
            的 all_objects 查询保证）。
          readOnly: true
      required:
      - attachment_ids
      - attachments
      - chain_of_thought
      - created_at
      - id
      - research_task_deleted
      - research_task_id
      - research_task_status
      - response_time
      - session_id
      - subagent_contents
      - token_count
      - token_detail
      - tool_calls
    ChatMessageRoleEnum:
      enum:
      - user
      - assistant
      - system
      type: string
      description: |-
        * `user` - 用户
        * `assistant` - 助手
        * `system` - 系统
    ChatRequest:
      type: object
      description: |-
        聊天请求输入验证

        用途：验证前端发送的聊天请求数据
        使用 Serializer 原因：输入数据不直接对应单一模型字段，
        需要灵活组合 message/chat_history/mode 等字段
      properties:
        message:
          type: string
          description: 用户消息内容，1-10000字符
          maxLength: 10000
          minLength: 1
        client_message_id:
          type: string
          description: 客户端消息幂等ID（可选），同一用户短时间内相同 ID 的重复请求将被去重
          maxLength: 64
        chat_history:
          type: array
          items:
            $ref: '#/components/schemas/Message'
          nullable: true
        mode:
          type: string
          default: agent
          description: 对话模式标识
          maxLength: 50
        use_tools:
          type: boolean
          default: true
          description: 是否使用工具
        use_web_search:
          type: boolean
          default: false
          description: 是否启用联网搜索
        use_knowledge_base:
          type: boolean
          default: false
          description: 是否启用知识库检索
        use_deep_thinking:
          type: boolean
          default: false
          description: 是否启用深度思考
        use_mcp:
          type: boolean
          default: false
          description: 是否启用 MCP 工具
        selected_mcp_servers:
          type: array
          items:
            type: string
            maxLength: 50
          nullable: true
          description: 选中的 MCP Server 名称列表（每个名称最长 50 字符），为空则使用所有已配置的 Server
        selected_tools:
          type: array
          items:
            type: string
            maxLength: 50
          nullable: true
          description: 选中的工具名称列表（每个名称最长 50 字符），为空则根据模式自动选择
        streaming:
          type: boolean
          default: false
          description: 是否流式输出
        session_id:
          type: string
          nullable: true
          maxLength: 100
        selected_knowledge_base:
          type: string
          nullable: true
          description: 选中的知识库ID
          maxLength: 200
        selected_knowledge_bases:
          type: array
          items:
            type: string
            maxLength: 200
          nullable: true
          description: 选中的知识库ID列表（多选）
        attachment_ids:
          type: array
          items:
            type: integer
          nullable: true
          description: 附件ID列表，用于基于文件内容回答问题
        provider_id:
          type: string
          nullable: true
          description: 模型提供商 ID（openai/deepseek/groq/baidu_qianfan/anthropic）
          maxLength: 50
        model_name:
          type: string
          nullable: true
          description: 模型名称，如 gpt-4o-mini、deepseek-v4-flash
          maxLength: 100
        special_params:
          type: object
          additionalProperties: {}
          nullable: true
          description: 提供商专属参数，如 DeepSeek 的 thinking/reasoning_effort
        temperature:
          type: number
          format: double
          maximum: 2.0
          minimum: 0.0
          nullable: true
          description: 温度参数，0-2之间
        max_tokens:
          type: integer
          maximum: 32768
          minimum: 1
          nullable: true
