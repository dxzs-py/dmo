  /api/v1/approvals/:
    get:
      operationId: approvals_list
      description: 审批列表（dj-15：真分页 + django-filter，替代 [:100] 硬截断）。
      parameters:
      - name: page
        required: false
        in: query
        description: 分页结果集中的页码。
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: 每页返回的结果数量。
        schema:
          type: integer
      tags:
      - approvals
