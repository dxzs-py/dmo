        GET /api/v1/realtime/snapshot/{session_id}/

        响应格式：
        {
            "code": 0,
            "data": {
                "session_id": "xxx",
                "session_title": "xxx",
                "messages": [
                    {
                        "id": "1",
                        "session_id": "xxx",
                        "role": "user",
                        "content": "...",
                        "created_at": "2026-07-18T...",
                        "tool_calls": []
                    }
                ],
                "tool_calls": [
                    {
                        "id": "call_xxx",
                        "tool_call_id": "call_xxx",
                        "name": "shell_exec",
                        "status": "completed",
                        "message_id": "1",
                        "approval": {"state": "approved", "approval_id": "call_xxx"}
                    }
                ],
                "approvals": [
                    {
                        "id": "1",
                        "interrupt_id": "call_xxx",
                        "tool_call_id": "call_xxx",
                        "state": "approved",
                        "created_at": "2026-07-18T...",
                        "resolved_at": "2026-07-18T..."
                    }
                ]
            }
        }
