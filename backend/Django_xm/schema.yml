          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApprovalWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApprovalWrite'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRead'
          description: ''
