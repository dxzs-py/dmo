      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApprovalReadList'
          description: ''
  /api/v1/approvals/{interrupt_id}/:
    get:
      operationId: approvals_retrieve
      description: |-
        审批归属校验 Mixin。

        使用方式::

            class ApprovalDetailView(BaseApprovalAccessMixin, APIView):
                def get(self, request, interrupt_id):
                    approval = Approval.objects.get(interrupt_id=interrupt_id)
                    self._assert_ownership(approval, request.user)
                    # ...

        或直接通过 `_get_owned_approval` 查询并校验::

            approval = self._get_owned_approval(interrupt_id, request.user)
            self._assert_ownership(approval, request.user)
      parameters:
      - in: path
        name: interrupt_id
        schema:
          type: string
        required: true
      tags:
      - approvals
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRead'
          description: ''
  /api/v1/approvals/{interrupt_id}/reject/:
    post:
      operationId: approvals_reject_create
      description: |-
        拒绝审批：通过 ApprovalGateway 统一路由（Path D）。

        chat / deep_research → Redis 信令唤醒执行服务。
      parameters:
      - in: path
        name: interrupt_id
        schema:
          type: string
        required: true
      tags:
      - approvals
      requestBody:
        content:
          application/json:
            schema:
