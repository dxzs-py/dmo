        path:
          type: string
          maxLength: 500
        title:
          type: string
          default: ''
          maxLength: 200
      required:
      - path
    PatchedChatMessage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        session:
          type: integer
          readOnly: true
          title: 会话
        role:
          allOf:
          - $ref: '#/components/schemas/ChatMessageRoleEnum'
          title: 角色
        content:
          type: string
          title: 内容
          maxLength: 50000
        sources:
          nullable: true
          title: 来源
        plan:
          nullable: true
          title: 计划
        chain_of_thought:
          nullable: true
          title: 思维链
        tool_calls:
          nullable: true
          title: 工具调用
        approval:
          nullable: true
          title: 审批数据
        reasoning:
          nullable: true
          title: 推理
        suggestions:
          nullable: true
          title: 建议问题
        versions:
          nullable: true
          title: 消息版本
        current_version:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: 当前版本索引
          description: 当前展示的版本索引，指向 versions 数组的位置
        attachments:
          type: string
          readOnly: true
        attachment_ids:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: 创建时间
        model:
          type: string
          nullable: true
          title: 使用的模型
          maxLength: 100
        token_count:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Token 数量
        token_detail:
          title: Token 明细
        response_time:
          type: number
          format: double
          title: 响应时间(秒)
        research_task_id:
          type: string
          nullable: true
          title: 关联深度研究任务ID
          maxLength: 100
        research_task_deleted:
          type: string
          readOnly: true
    PatchedChatSessionUpdate:
      type: object
      description: |-
        会话更新序列化器

        用途：更新会话标题等字段
        绑定模型：ChatSession
        允许修改 title 和 selected_knowledge_base 字段
      properties:
        title:
          type: string
          title: 会话标题
          maxLength: 200
        selected_knowledge_base:
          type: string
          nullable: true
          title: 选中的知识库
          maxLength: 200
        selected_knowledge_bases:
          nullable: true
          title: 选中的知识库列表
    SSEEvent:
      type: object
      description: |-
        SSE 事件流帧的简化 schema（仅用于 OpenAPI 文档描述）。

        SSE 帧的协议字段（``event``/``data``），``data`` 为 JSON 字符串。
        OpenAPI 3.0 无法精确表达流式响应，此处以近似结构描述单帧，
        供前端了解事件载荷字段，实际帧格式以 ``text/event-stream`` 协议为准。
      properties:
        event:
          type: string
          description: 事件类型（如 message、error、done）
        data:
          type: string
          description: 事件数据（JSON 字符串）
      required:
      - data
    SourceEnum:
      enum:
      - chat
      - deep_research
      - learning
      type: string
      description: |-
        * `chat` - Chat
        * `deep_research` - Deep Research
        * `learning` - Learning
    StateEnum:
      enum:
      - pending
      - processing
      - waiting
      - approved
      - rejected
      - timeout
      type: string
      description: |-
        * `pending` - Pending
        * `processing` - Processing
        * `waiting` - Waiting
        * `approved` - Approved
        * `rejected` - Rejected
        * `timeout` - Timeout
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenVerify:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
      required:
      - token
    UserEventWrite:
      type: object
      properties:
        event_type:
          type: string
          maxLength: 50
        event_category:
          type: string
          maxLength: 20
        session_id:
          type: string
          default: ''
          maxLength: 100
        resource_id:
          type: string
          default: ''
          maxLength: 100
        resource_type:
          type: string
          default: ''
          maxLength: 50
        metadata:
          type: object
          additionalProperties: {}
        duration_ms:
          type: integer
          nullable: true
        is_success:
          type: boolean
          default: true
        error_message:
          type: string
          default: ''
      required:
      - event_category
      - event_type
    UserRegister:
      type: object
      description: |-
        用户注册序列化器。

        校验规则：
            - password 与 password_confirm 必须一致（基于 validated_data 比较）
            - password 至少 8 位，必须同时包含大写字母、小写字母、数字、特殊字符
      properties:
        username:
          type: string
          title: 用户名
          description: 必填；长度为150个字符或以下；只能包含字母、数字、特殊字符“@”、“.”、“-”和“_”。
          pattern: ^[\w.@+-]+$
          maxLength: 150
        password:
          type: string
          writeOnly: true
          title: 密码
          maxLength: 128
          minLength: 8
        password_confirm:
          type: string
          writeOnly: true
          title: 确认密码
        email:
          type: string
          format: email
          title: 电子邮件地址
          maxLength: 254
        mobile:
          type: string
          nullable: true
          title: 手机号
          pattern: ^1[3-9]\d{9}$
          maxLength: 11
      required:
      - password
      - password_confirm
      - username
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
