      description: 聊天历史消息项 - 用于请求输入中的 chat_history 字段验证
      properties:
        role:
          allOf:
          - $ref: '#/components/schemas/MessageRoleEnum'
          description: |-
            消息角色：user/assistant/system

            * `user` - user
            * `assistant` - assistant
            * `system` - system
        content:
          type: string
          description: 消息内容，最大50000字符
          maxLength: 50000
        attachment_ids:
          type: array
          items:
            type: integer
          nullable: true
          description: 该消息关联的附件ID列表
      required:
      - content
      - role
    MessageRoleEnum:
      enum:
      - user
      - assistant
      - system
      type: string
      description: |-
        * `user` - user
        * `assistant` - assistant
        * `system` - system
    ModeEnum:
      enum:
      - agent
      - deep-research
      type: string
      description: |-
        * `agent` - 代理
        * `deep-research` - 深度研究
