paths:
  /api/v1/analytics/track/event/:
    post:
      operationId: analytics_track_event_create
      description: |-
        记录用户事件

        - ValidationError → 全局 handler 返回 400
        - UserEvent.objects.create / cache invalidate 失败 → 冒泡到全局 handler
      tags:
      - analytics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserEventWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserEventWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserEventWrite'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          description: 事件已记录
  /api/v1/analytics/track/feature-use/:
    post:
      operationId: analytics_track_feature_use_create
      description: |-
        记录功能使用事件

