    PatchedChatMessage:
      type: object
      description: |-
        消息序列化器（模型输出 + 创建/更新输入）

        research_task_map 契约（dj-04）：
        - 实例化用于序列化（读取 ``.data``，含经 ChatSessionDetailSerializer
          嵌套使用）时，必须经 ``context={"research_task_map": {...}}`` 提供
          研究任务映射，映射由 :func:`build_research_task_map` 一次批量查询
          构建（单条消息场景同样构造单元素映射）；缺失映射时
          research_task_status / research_task_deleted 直接 KeyError 快速
          失败，不提供逐条查询兜底。
        - 仅做输入校验（``data=`` 且不读取 ``.data``）的实例传空映射即可。
      properties:
        id:
          type: integer
          readOnly: true
        session_id:
          type: integer
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/ChatMessageRoleEnum'
          title: 角色
        content:
          type: string
          title: 内容
          maxLength: 50000
        sources:
          title: 来源
        plan:
          title: 计划
        chain_of_thought:
          readOnly: true
        tool_calls:
          readOnly: true
        approval:
          title: 审批数据
        reasoning:
          title: 推理
        subagent_contents:
          readOnly: true
        suggestions:
          title: 建议问题
        versions:
          title: 消息版本
        current_version:
          type: integer
        is_finalized:
          type: boolean
        attachments:
          type: array
          items: {}
          readOnly: true
        attachment_ids:
          type: array
          items:
            type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        model:
          type: string
          nullable: true
          title: 使用的模型
          maxLength: 100
        token_count:
          type: integer
          readOnly: true
        token_detail:
          readOnly: true
        response_time:
          type: number
          format: double
          readOnly: true
        research_task_id:
          type: string
          readOnly: true
        research_task_status:
          type: string
          nullable: true
          description: |-
            返回关联研究任务的权威状态（P7 根因修复；dj-04 批量化）

            前端刷新后凭该字段判定"研究进行中/已完成"，避免快照不含状态导致误显。
            从 context["research_task_map"] 批量映射读取（调用方经
            build_research_task_map 一次 all_objects 查询构建，含软删除），
            消除逐条查询的 N+1；映射缺失时 KeyError 快速失败，禁止逐条查询兜底。
          readOnly: true
        research_task_deleted:
          type: boolean
          nullable: true
          description: |-
            检查关联的研究任务是否已软删除（dj-04 批量化）

            语义与逐条查询版完全一致：任务不存在 → True（视为已删除）；
            任务存在 → task.is_deleted（软删除可见性由 build_research_task_map
            的 all_objects 查询保证）。
          readOnly: true
