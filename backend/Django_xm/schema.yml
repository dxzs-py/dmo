        用途：会话详情页展示，包含完整消息列表
        绑定模型：ChatSession
        注意：messages 字段会触发额外查询，建议配合 prefetch_related('messages') 使用
      properties:
        id:
          type: integer
          readOnly: true
        session_id:
          type: string
          readOnly: true
          title: 会话ID
        title:
          type: string
          title: 会话标题
          maxLength: 200
        mode:
          allOf:
          - $ref: '#/components/schemas/ModeEnum'
          title: 对话模式
        selected_knowledge_base:
          type: string
          nullable: true
          title: 选中的知识库
          maxLength: 200
        selected_knowledge_bases:
          nullable: true
          title: 选中的知识库列表
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
          readOnly: true
        message_count:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: 创建时间
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: 更新时间
      required:
      - created_at
      - id
      - message_count
      - messages
      - session_id
      - updated_at
    ChatSessionList:
      type: object
      description: |-
        会话列表序列化器（轻量）

        用途：会话列表页展示，仅包含摘要信息
        绑定模型：ChatSession
      properties:
        id:
          type: integer
          readOnly: true
        session_id:
          type: string
          readOnly: true
          title: 会话ID
        title:
          type: string
          title: 会话标题
          maxLength: 200
        mode:
          allOf:
          - $ref: '#/components/schemas/ModeEnum'
          title: 对话模式
        selected_knowledge_base:
          type: string
          nullable: true
          title: 选中的知识库
          maxLength: 200
        selected_knowledge_bases:
          nullable: true
          title: 选中的知识库列表
        message_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: 创建时间
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: 更新时间
      required:
